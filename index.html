
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONNAPAREDDY | Sale</title>
https://cdn.tailwindcss.com
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{font-family:'Inter',sans-serif}
.notification{opacity:0;transform:translateX(120%);transition:all .3s}
.notification.show{opacity:1;transform:translateX(0)}
</style>
</head>

<body class="bg-white">

<!-- TOP SALE BAR -->
<div class="bg-black text-white text-center py-3 fixed top-0 w-full z-[999]">
🔥 MEGA SALE: FLAT 50% OFF ON ALL ITEMS 🔥
</div>

<!-- NAV -->
<nav class="fixed top-[44px] w-full bg-white shadow z-50">
<div class="flex justify-between p-4">
<h1 class="font-bold text-xl">Ponnapareddy</h1>
<div class="relative">
<i data-lucide="shopping-bag"></i>
<span id="cart-count" class="absolute -top-2 -right-2 text-xs bg-black text-white px-1 rounded">0</span>
</div>
</div>
</nav>

<!-- POPUP -->
<div id="popup" class="fixed inset-0 bg-black/70 flex items-center justify-center z-[999]">
<div class="bg-white p-6 rounded-xl text-center">
<h2 class="text-xl font-bold">🎉 50% OFF</h2>
<p>Grab all items at half price!</p>
<button onclick="closePopup()" class="bg-black text-white px-4 py-2 mt-3">Shop</button>
</div>
</div>

<!-- HERO -->
<section class="pt-32 text-center py-16 bg-gray-100">
<h1 class="text-4xl font-bold">THARUN STYLE'S SALE</h1>
<p class="mt-2">Everything 50% OFF</p>
</section>

<!-- PRODUCTS -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-6 p-6">

<!-- ITEM -->
<div>
<div class="relative">
<img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400" class="rounded">
<span class="absolute top-2 left-2 bg-red-600 text-white px-2 text-xs">50% OFF</span>
</div>
<h3>Jacket</h3>
<p class="text-red-600">$64.5</p>
<p class="line-through text-gray-400">$129</p>
<button onclick="addToCart('Jacket')" class="bg-black text-white px-3 py-1 mt-2">Add</button>
</div>

<div>
<div class="relative">
<img src="https://images.unsplash.com/photo-1554568218-0f1715e72254?w=400" class="rounded">
<span class="absolute top-2 left-2 bg-red-600 text-white px-2 text-xs">50% OFF</span>
</div>
<h3>Tee</h3>
<p class="text-red-600">$22.5</p>
<p class="line-through text-gray-400">$45</p>
<button onclick="addToCart('Tee')" class="bg-black text-white px-3 py-1 mt-2">Add</button>
</div>

<div>
<div class="relative">
<img src="https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=400" class="rounded">
<span class="absolute top-2 left-2 bg-red-600 text-white px-2 text-xs">50% OFF</span>
</div>
<h3>Jeans</h3>
<p class="text-red-600">$44</p>
<p class="line-through text-gray-400">$89</p>
<button onclick="addToCart('Jeans')" class="bg-black text-white px-3 py-1 mt-2">Add</button>
</div>

<div>
<div class="relative">
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38?w=400" class="rounded">
<span class="absolute top-2 left-2 bg-red-600 text-white px-2 text-xs">50% OFF</span>
</div>
<h3>Hoodie</h3>
<p class="text-red-600">$30</p>
<p class="line-through text-gray-400">$60</p>
<button onclick="addToCart('Hoodie')" class="bg-black text-white px-3 py-1 mt-2">Add</button>
</div>

</div>

<!-- TOAST -->
<div id="toast" class="notification fixed bottom-5 right-5 bg-black text-white p-3 rounded">
Added
</div>

<script>
lucide.createIcons();
let count = localStorage.getItem('cart')||0;
document.getElementById('cart-count').innerText=count;
function addToCart(name){
count++;
localStorage.setItem('cart',count);
document.getElementById('cart-count').innerText=count;
showToast(name+' added');
}
function showToast(msg){
const t=document.getElementById('toast');
t.innerText=msg;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
}
function closePopup(){document.getElementById('popup').style.display='none'}
</script>

</body>
</html>
